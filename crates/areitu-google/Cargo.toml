[package]
name = "areitu-google"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
keyring = "4.2.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["blocking", "json", "form", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
url = "2.5.8"
webbrowser = "1.2.4"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"
