[package]
name = "areitu-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
kamadak-exif = "0.6.1"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
